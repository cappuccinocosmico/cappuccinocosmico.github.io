[workspace]
resolver = "2"
members = ["blog", "content", "site-egui"]

[workspace.package]
version = "0.1.0"
authors = ["Nicole Venner <nvenner@protonmail.ch>"]
edition = "2021"

[workspace.dependencies]
site-content = { path = "content" }
num-rational = "0.4.2"
pulldown-cmark = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
server_fn = "0.8.8"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
